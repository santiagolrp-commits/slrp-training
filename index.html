<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SLRP Training">
  <meta name="theme-color" content="#111111">

  <title>SLRP Training</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #111111;
      --muted: #707070;
      --border: #dedede;
      --accent: #111111;
      --warning: #fff8e6;
      --warning-border: #d4a72c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        120px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: -0.6px;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      border-radius: 999px;
      background: #e9e9e9;
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .metric {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 12px;
    }

    .metric strong {
      display: block;
      font-size: 23px;
      margin: 2px 0;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 0;
      background: rgba(245,245,247,.95);
      backdrop-filter: blur(12px);
    }

    button,
    .btn {
      min-height: 45px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      padding: 10px 12px;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    button.active,
    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 4px 0 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin: 10px 0;
    }

    .important {
      background: var(--warning);
      border-color: var(--warning-border);
    }

    .exercise-title {
      font-size: 18px;
      line-height: 1.2;
      font-weight: 750;
    }

    .presc {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .note {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.35;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .between {
      justify-content: space-between;
      align-items: center;
    }

    .grow {
      flex: 1;
      min-width: 0;
    }
